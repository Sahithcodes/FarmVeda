<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E36"/>
      <stop offset="100%" stop-color="#0E3820"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>

  <!-- Subtle Soil Base Mound -->
  <ellipse cx="96" cy="154" rx="58" ry="12" fill="#8D6E45" opacity="0.8"/>

  <!-- Digital Circuit Traces connecting into the roots -->
  <g stroke="#6EE7B7" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M 60 148 L 74 148 L 84 136"/>
    <path d="M 132 148 L 118 148 L 108 136"/>
    <circle cx="60" cy="148" r="3.5" fill="#6EE7B7"/>
    <circle cx="132" cy="148" r="3.5" fill="#6EE7B7"/>
    <path d="M 96 154 L 96 138"/>
  </g>

  <!-- Central Stem & Sprout -->
  <path d="M 96 140 Q 96 100 96 68" stroke="#F0FDF4" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Left Main Leaf -->
  <path d="M 96 100 C 65 96 52 70 68 50 C 86 64 94 82 96 100 Z" fill="url(#leafGrad)"/>
  <!-- Leaf Vein / Circuit line -->
  <path d="M 94 92 Q 78 78 72 64" stroke="#D1FAE5" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="72" cy="64" r="2.5" fill="#A7F3D0"/>

  <!-- Right Leaf -->
  <path d="M 96 85 C 124 80 135 56 120 40 C 105 52 98 70 96 85 Z" fill="url(#sproutGrad)"/>
  <path d="M 98 78 Q 110 65 116 52" stroke="#ECFDF5" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle cx="116" cy="52" r="2" fill="#FFFFFF"/>

  <!-- Top Sprout Bud -->
  <circle cx="96" cy="46" r="4.5" fill="#FBBF24"/>
  <!-- Small Digital Signal Waves -->
  <path d="M 88 36 A 11 11 0 0 1 104 36" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 82 28 A 18 18 0 0 1 110 28" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>

