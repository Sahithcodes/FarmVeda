<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1B5E36" />
    <meta name="description" content="FarmVeda - Smart Farming. Smarter Living. AI-Powered Smart Agriculture Progressive Web Application." />
    
    <!-- PWA Meta tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FarmVeda" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    
    <!-- Google Fonts for English, Hindi, and Kannada readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>FarmVeda - Smart Farming. Smarter Living.</title>
  </head>
  <body class="bg-warmCream text-gray-900 antialiased selection:bg-forest-100 selection:text-forest-900 select-none md:select-auto min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for offline functionality
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('FarmVeda ServiceWorker registered with scope: ', registration.scope);
            },
            (err) => {
              console.log('FarmVeda ServiceWorker registration failed: ', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
