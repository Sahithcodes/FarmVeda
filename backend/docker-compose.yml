services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmveda}
      POSTGRES_USER: ${POSTGRES_USER:-farmveda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - farmveda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmveda} -d ${POSTGRES_DB:-farmveda}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  farmveda_pgdata:
